specVersion: 0.0.8
schema:
  file: schema.graphql

dataSources:
  - kind: ethereum/contract
    name: ReferralTracker
    network: matic
    source:
      address: "0x329612BB11Eea1Ea5065993DC32b41C86D6068c2"
      abi: ReferralTracker
      startBlock: 62773319
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Referral
        - Referrer
        - ReferrerTotal
      abis:
        - name: ReferralTracker
          file: ./abis/ReferralTracker.json
      blockHandlers:
        - handler: createPackSaleTiers
          filter:
            kind: once
      eventHandlers:
        - event: ReferrerUpdated(string,string,uint256)
          handler: handleReferrerUpdated
      file: src/referralTracker.ts

  - kind: ethereum/contract
    name: ClubMinter
    network: matic
    source:
      address: "0xeEE0d855112b71Dc68d72053594Af03F92C586Ae"
      abi: ClubMinter
      startBlock: 66056325
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - InfluenceMint
        - SaleClub
      abis:
        - name: ClubMinter
          file: ./abis/ClubMinter.json
        - name: SwappingPackSale
          file: abis/SwappingPackSale.json
      blockHandlers:
        - handler: createPackSaleTiers
          filter:
            kind: once
      eventHandlers:
        - event: SharesMinted(indexed uint256,uint256,string,uint256,uint256)
          handler: handleSharesMinted
      file: src/saleTiers.ts

  # Packs can also be paid for with SVV, through a voucher contract that swaps
  # it for the pack.  It emits the same PacksBought event with the same USD
  # cost as the tiers do, but it is not itself a sale tier (it has no clubs and
  # no pricing of its own), so it gets its own data source with just that one
  # handler rather than joining SALE_CONTRACTS.
  - kind: ethereum/contract
    name: PackVoucher
    network: matic
    source:
      address: "0x9De075D87B812eC647d5541CB50d65Bc06Ec6509"
      abi: PackVoucher
      startBlock: 67923247
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - PacksBought
        - TxMints
      abis:
        - name: PackVoucher
          file: abis/PackVoucher.json
        - name: SwappingPackSale
          file: abis/SwappingPackSale.json
      eventHandlers:
        - event: PacksBought(indexed address,string,indexed uint256,uint256,uint256)
          handler: handleVoucherPacksBought
        # The voucher is an ERC-20; the only transfer that matters here is
        # the burn, which batchRedeem does once per invocation before it
        # mints anything, so it delimits invocations within a transaction.
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleVoucherTransfer
      file: src/saleTiers.ts

  - kind: ethereum/contract
    name: UniswapV2Factory
    network: matic
    source:
      address: "0x9e5A52f57b3038F1B8EeE45F28b3C1967e22799C"
      abi: UniswapV2Factory
      # We want to start this at "launch time", same as the ClubMinter
      # handlers.  However, using the exact same block can cause issues
      # with graph-node, and thus we set this to one block earlier.
      startBlock: 66056324
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Token
        - TokenPair
        - PriceObservation
      abis:
        - name: IERC20Metadata
          file: ./abis/IERC20Metadata.json
        - name: UniswapV2Factory
          file: ./abis/UniswapV2Factory.json
        - name: UniswapV2Pair
          file: abis/UniswapV2Pair.json
      blockHandlers:
        - handler: maybeObservePrices
          filter:
            kind: polling
            every: 100
      file: src/uniswapPrices.ts

templates:
  - kind: ethereum/contract
    name: PackSaleForReferrals
    network: matic
    source:
      abi: SwappingPackSale
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ReferrerBonus
        - ReferrerTotal
      abis:
        - name: SwappingPackSale
          file: abis/SwappingPackSale.json
      eventHandlers:
        - event: ReferralBonusGiven(string,string,uint256,uint256,uint256,uint256)
          handler: handleReferralBonus
      file: src/referralTracker.ts
  - kind: ethereum/contract
    name: PackSaleForShop
    network: matic
    source:
      abi: SwappingPackSale
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - PacksBought
        - PriceStep
        - SaleClub
        - SaleTier
      abis:
        - name: SwappingPackSale
          file: abis/SwappingPackSale.json
      eventHandlers:
        - event: ClubAdded(indexed uint256)
          handler: handleClubAdded
        - event: ClubRemoved(indexed uint256)
          handler: handleClubRemoved
        - event: ClubSalePaused(indexed uint256)
          handler: handleClubSalePaused
        - event: Paused(address)
          handler: handleSalePaused
        - event: Unpaused(address)
          handler: handleSaleUnpaused
        - event: PricingUpdated((uint256,uint256)[])
          handler: handlePricingUpdated
        - event: SeedUpdated(bytes32)
          handler: handleSeedUpdated
        - event: PacksBought(indexed address,string,indexed uint256,uint256,uint256)
          handler: handlePacksBought
      file: src/saleTiers.ts
