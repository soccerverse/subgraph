# GraphQL schema for all the data we collect from the Soccerverse
# smart contracts (excluding Democrit which has its own subgraph).

################################################################################
# Referral leaderboard

# A user that has referred others.
type Referrer @entity (immutable: false) {
  # The ID is the Xaya account name as Bytes.
  id: Bytes!
  account: String!
  referrals: [Referral!]! @derivedFrom (field: "referrer")
  bonuses: [ReferrerBonus!]! @derivedFrom (field: "referrer")
  totals: [ReferrerTotal!]!  @derivedFrom (field: "referrer")
  # The current (last) ReferrerTotal for this referrer.
  currentTotal: ReferrerTotal!
}

# Each user that a referrer has referred is tracked here.
type Referral @entity (immutable: false) {
  # The ID is the Xaya account name as Bytes.
  id: Bytes!
  account: String!
  referrer: Referrer!
  timestamp: BigInt!
}

# A referral bonus given.
type ReferrerBonus @entity (immutable: true) {
  # The ID is constructed from txid and log index and just a unique ID.
  id: Bytes!
  referrer: Referrer!
  referral: Referral!
  timestamp: BigInt!
  clubId: BigInt!
  packsBought: BigInt!
  usdSpent: BigInt!
  bonusShares: BigInt!
}

# Running totals for referral stats.  Whenever they change (such as new referral
# or referral overwritten, or bonus received), we add a new entry here with
# updated totals.  From this, stats for some time range can be derived
# by subtracting the totals.
type ReferrerTotal @entity (immutable: true) {
  # The ID is constructed from account name and a running counter for how many
  # totals we already have for this account.
  id: Bytes!
  referrer: Referrer!
  timestamp: BigInt!
  # How many preceding totals there already are for this referrer.
  index: BigInt!
  referrals: BigInt!
  bonusShares: BigInt!
  # Total USD spent by referrals.
  usdSpent: BigInt!
}

################################################################################
# Shop and pack-sale stuff

# A tier (individual sales contract) in the pack sale.
type SaleTier @entity (immutable: false) {
  # The ID is the contract address (as Bytes).
  id: Bytes!
  name: String!
  # True if the sale is active, i.e. not paused.
  active: Boolean!
  clubs: [SaleClub!]! @derivedFrom (field: "tier")
  pausedClubs: [SaleClub!]! @derivedFrom (field: "pausedInTier")
  pricingSteps: [PricingStep!]! @derivedFrom (field: "tier")
  packsBought: [PacksBought!]! @derivedFrom (field: "tier")
}

# A pricing step for a sale tier.
type PricingStep @entity (immutable: false) {
  # The ID is the tier ID / address and the step index added.
  id: Bytes!
  tier: SaleTier!
  index: Int!
  # Number of shares available at this price.
  numShares: Int!
  # Price of one share in this batch.
  price: BigInt!
  # Minimum number of shares minted before this is in effect.
  fromTotal: Int!
  # Maximum number of shares minted when this is still in effect.
  toTotal: Int!
}

# A club in the sale.
type SaleClub @entity (immutable: false) {
  # The ID is the club ID as integer converted to bytes.
  id: Bytes!
  clubId: Int!
  # The SaleTier this is part of, if the club is actively sold.
  tier: SaleTier
  # The SaleTier this is part of as a paused club.
  pausedInTier: SaleTier
  # Total number of shares minted in the club so far.
  minted: Int!
  # The current tranche for the sale (or -1 if not for sale).
  trancheIndex: Int!
  # Number of influence remaining at the current tranche.  Zero if
  # there is none for sale.
  remainingInTranche: Int!
  primaryPack: Pack @derivedFrom (field: "primaryClub")
  containedInPacks: [PackShareContent!]! @derivedFrom (field: "club")
  packsBought: [PacksBought!]! @derivedFrom (field: "primaryClub")
}

# A pack that can be bought in the shop.
type Pack @entity (immutable: false) {
  # The ID is the primary club ID as integer converted to bytes.
  id: Bytes!
  primaryClub: SaleClub!
  # All club shares in the pack (including the primary one).
  shares: [PackShareContent!]! @derivedFrom (field: "pack")
  # Maximum number of packs that can be purchased.
  maxPacks: Int!
  # Cost of one pack in USDC/token base units.
  cost: BigInt!
}

# Mapping table for all club shares included in packs.
type PackShareContent @entity (immutable: false) {
  # The ID is the pack ID concat the club ID.
  id: Bytes!
  pack: Pack!
  club: SaleClub!
  num: Int!
}

# Each individual pack sale is recorded here.
type PacksBought @entity (immutable: true) {
  # The ID is constructed from txid and log index and just a unique ID.
  id: Bytes!
  timestamp: BigInt!
  # The block this was bought in, so it can be joined to the game ledger,
  # which is keyed by height and not by time.
  height: BigInt!
  # The transaction this purchase happened in.  The InfluenceMints it paid
  # for point back at it (see "mints"); this is kept for cross-referencing
  # with the chain itself.
  txHash: Bytes!
  # The influence mints this purchase paid for.  The link is written while
  # indexing: both sale paths mint an operation's shares immediately before
  # they emit its PacksBought, so the purchase claims the transaction's
  # still-unclaimed mints to its receiver.  (txHash, receiver) alone would
  # not do: one voucher batch can hold several purchases for one receiver.
  mints: [InfluenceMint!]! @derivedFrom (field: "purchase")
  # The buying address.
  buyer: Bytes!
  # The account name receiving the influence.
  receiver: String!
  primaryClub: SaleClub!
  # The tier of this pack, at the time of buying (in case the club is
  # changed later to be in another tier).  Null when the pack was paid for
  # with SVV through the voucher contract, which is not a tier.
  tier: SaleTier
  numPacks: Int!
  usdSpent: BigInt!
}

# Every influence mint from the sale, priced at the tranches it consumed.
#
# The sale does not charge a bundle price: each club's shares cost that
# club's own tranche price, which is why a pack's single price decomposes
# across its clubs exactly.  Doing that arithmetic here rather than in a
# consumer is the whole point of the entity.  The three inputs it needs (the
# club's tier, that tier's ladder, and the club's cumulative mint count) are
# simply the current values while the handler runs, so there is no history
# to reconstruct and no way to ask the question as of the wrong block.
#
# Written for EVERY mint, paid or not, because the sale's own tranche counter
# is moved by all of them: the 20,000-per-club premine (block ~82.9M, months
# into the sale) pushed every club 20,000 further up its ladder for all the
# purchases that came after it.  Keeping the unpaid ones (premine, admin
# allocations, referral bonuses) lets them carry a defensible value at
# receipt without pretending anyone spent it; the paid ones point at the
# purchase that paid for them.
type InfluenceMint @entity (immutable: false) {
  # The ID is the transaction hash with the log index appended.
  id: Bytes!
  timestamp: BigInt!
  height: BigInt!
  txHash: Bytes!
  club: SaleClub!
  # The account name receiving the influence.
  receiver: String!
  num: Int!
  # The club's cumulative mint count before this mint, which is what fixed
  # where on the ladder it sat: the input the pricing used, and what the
  # voucher re-pricing reads to find an invocation's starting supply.  The
  # stored usdCost is the authoritative number, priced by the ladder in
  # force when the mint was indexed.
  mintedBefore: Int!
  # The tier whose ladder priced it, and the resulting cost in USD base
  # units (6dp).  Both are as of this block: a club can leave its tier
  # later, and then its old mints would no longer be priceable at all.  A
  # club that was paused out of its tier (sold out) keeps that tier's
  # ladder for pricing: the premine and later give-aways really minted
  # shares of sold-out clubs, and a null price there would report the most
  # sold-out clubs' shares as free.  Null tier means the club was in no
  # tier at all, and the cost is then zero.
  tier: SaleTier
  usdCost: BigInt!
  # The purchase this mint was paid by, or null for the free ones.  Written
  # when the PacksBought event arrives: both sale paths mint an operation's
  # shares immediately before emitting its PacksBought, so the purchase
  # claims the transaction's still-unclaimed, non-bonus mints to its
  # receiver.  For voucher purchases the claimed mints are then re-priced
  # from their club's supply at the start of the batchRedeem invocation,
  # which validates every operation's cost before it mints anything:
  # operations of one invocation overlapping on a club are all charged
  # from the supply the invocation started at.  No such overlap exists on
  # chain so far, so the re-pricing has never changed a stored value; it
  # is what keeps sum(mints of a purchase) == usdSpent if one appears.
  purchase: PacksBought
  # The transaction this belongs to, as a TxMints reference so the
  # transaction's mints are a derived lookup rather than a maintained list.
  tx: TxMints!
  # TxMints.voucherBurns as it stood when this mint was recorded.  Mints of
  # one batchRedeem invocation share it (the invocation burns its whole
  # cost before minting anything), and the voucher re-pricing must not
  # reach across invocations: each one is validated against the supply as
  # it stood when that invocation started, not when the transaction did.
  voucherInvocation: Int!
  # True for the free referral bonus the sale mints to the referrer right
  # after the buyer's own PacksBought.  Set from ReferralBonusGiven; this
  # is what keeps the bonus from being claimed by a later purchase for the
  # referrer in the same transaction.
  referralBonus: Boolean!
}

# One row per transaction that minted influence, so that a PacksBought
# event can look up the transaction's mints and claim the ones its
# purchase paid for, and so that voucher invocations can be told apart.
# Bookkeeping for indexing; not meant for querying.
type TxMints @entity (immutable: false) {
  # The ID is the transaction hash.
  id: Bytes!
  # The influence mints of the transaction.
  mints: [InfluenceMint!]! @derivedFrom (field: "tx")
  # Number of voucher burns seen in the transaction so far.
  voucherBurns: Int!
}

################################################################################
# Price data for WCHI from Uniswap

# Data about a token that we track prices for.
type Token @entity (immutable: true) {
  # The ID is the contract address.
  id: Bytes!
  # Number of decimals.
  decimals: Int!
  # The token symbol / tracker.
  symbol: String!
}

# A pair of tokens that we track prices for.
type TokenPair @entity (immutable: true) {
  # The ID is constructed by concat of tradedToken and baseToken.
  id: Bytes!
  # The token being traded (such as WCHI for the WCHI/WETH pair).
  tradedToken: Token!
  # The base token in which prices are denominated (such as WETH for WCHI/WETH).
  baseToken: Token!
  # The address of the Uniswap pair contract.
  uniswapPair: Bytes!
  # Price observations for this token pair.
  prices: [PriceObservation!]! @derivedFrom (field: "pair")
}

# Average, periodic pricing data from Uniswap v2 for token pairs.  These
# observations are recorded at fixed intervals, at virtual timestamps that
# represent these intervals exactly (such as UNIX timestamps for every whole
# hour or daily UTC midnights).
type PriceObservation @entity (immutable: true) {
  # The ID is constructed by concat of the token pair ID and the virtual
  # timestamp as 64-bit big-endian integer (so IDs sort chronologically).
  id: Bytes!
  # The token pair this is for.
  pair: TokenPair!

  # The virtual timestamp this observation is for.
  virtualTimestamp: BigInt!

  # The exact timestamp this observation is for.  This might be slightly
  # larger than the virtual timestamp, since the actual logic to take
  # observations runs at certain block intervals, and uses the first block
  # it runs on after a desired exact observation timestamp to get the values.
  exactTimestamp: BigInt!

  # The prices are encoded as fixed-point numbers with denominator 2**112,
  # like Uniswap's UQ112x112 format.  Unlike Uniswap, they take token decimals
  # into account already, so the real number represented by the fixed-point
  # value is the actual, human-readable token price in real token units
  # (not the underlying integer base units).

  # The cumulative price from the Uniswap pair as per the timestamp, encoded
  # as fixed-point number.
  cumulativePrice: BigInt!
  # The moving average 24 hour price of the token as per the observation time.
  # This will not be set for the initial 24 hours of observations.
  average24h: BigInt
}
